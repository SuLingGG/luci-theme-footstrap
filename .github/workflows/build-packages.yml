name: 编译并发布主题包

# 一条路径：官方 SDK 里 make 一次，产物先作为 artifact 上传，再由 release 作业
# 挂到 GitHub Release 上。
#
# 发布不依赖外部打 tag：release 作业自己按 CHANGELOG 的最新版本号建 tag 并发布。
# 之前那版要求「有人先打 v* tag」，结果 push 到 main 时 release 作业被 skipped，
# 跑完 action 什么也没发出去。
#
# 这份工作流替换了上游的 build.yml（owfeed 出包）、pages.yml（Pages 预览）、
# rerun-infra.yml 和 anchor-mutants.yml（真机 e2e 的重试与变异检查）：那套流程要求
# 仓库里有 tag、有上一个 release、还要在 runner 里起 qemu 路由器，与「把汉化主题
# 编成 ipk/apk」无关，在这个 fork 上只会红。
#
# 只需要选一个 SDK：24.10 走 opkg（ipk），25.12 走 apk。主题包是 noarch，一份
# x86_64 SDK 编出来的包在任何架构上都能装，所以没有架构矩阵。

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: SDK 版本（决定包格式：24.10 出 ipk，25.12 出 apk）
        type: choice
        default: all
        options:
          - all
          - openwrt-24.10
          - openwrt-25.12
      publish:
        description: 发布到 Release（关掉只出 artifact）
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

# 同一分支的新提交取代旧的一次运行；tag 与手动触发各自独立，不会被互相取消。
concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  # 只维护这两行：SDK 的发布版本与压缩包名，换版本就换这里。
  SDK_PKG_24_10: openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  SDK_PKG_25_12: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  prepare:
    name: 生成矩阵
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: 按选择筛出 SDK
        id: m
        env:
          SDK: ${{ inputs.sdk || 'all' }}
        run: |
          set -eu
          case "$SDK" in
            all)
              matrix='{"include":[{"sdk":"openwrt-24.10","ext":"ipk"},{"sdk":"openwrt-25.12","ext":"apk"}]}' ;;
            openwrt-24.10)
              matrix='{"include":[{"sdk":"openwrt-24.10","ext":"ipk"}]}' ;;
            openwrt-25.12)
              matrix='{"include":[{"sdk":"openwrt-25.12","ext":"apk"}]}' ;;
            *)
              echo "不支持的 SDK：$SDK" >&2
              exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.sdk }}
    needs: prepare
    runs-on: ubuntu-24.04
    # 下 SDK 是几百 MB、feeds 还要在 runner 里 clone 一次；卡住时宁可失败，
    # 也不要挂满默认的六小时。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # 版本号优先取最近的 tag；没有 tag 就退回 CHANGELOG 的最新一节。
          fetch-depth: 0

      - name: 下载并解开 SDK
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          set -eu
          case "$SDK" in
            openwrt-24.10) pkg="$SDK_PKG_24_10" ;;
            openwrt-25.12) pkg="$SDK_PKG_25_12" ;;
            *) echo "不支持的 SDK：$SDK" >&2; exit 1 ;;
          esac
          # 发布版本就是压缩包名里的那一段，不再单独维护一份。
          rel=$(printf '%s' "$pkg" | sed -n 's/^openwrt-sdk-\([0-9][0-9.]*\)-.*/\1/p')
          url="https://downloads.openwrt.org/releases/$rel/targets/x86/64/$pkg"
          # tar --zstd 要 zstd 这个可执行文件；runner 镜像里通常有，没有就装。
          command -v zstd >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          }
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/sdk.tar.zst" "$url"
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/sdk" --strip-components=1
          rm -f "$RUNNER_TEMP/sdk.tar.zst"

      - name: 取版本号
        id: ver
        run: |
          set -eu
          # 规则与 release 作业完全一致，否则包内版本号与 Release tag 会对不上：
          # 别人打的 v* tag 优先，否则取 CHANGELOG 的最新一节。
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          fi
          [ -n "${v:-}" ] || {
            echo "取不到版本号：CHANGELOG.md 里没有 '## [x.y.z]'" >&2
            exit 1
          }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本号 $v"

      - name: 在 SDK 里编译
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: sh tools/ci-sdk-build.sh "$RUNNER_TEMP/sdk" "$PWD/dist"

      - name: 检查产物
        # 语言包没编出来时构建本身不报错，只会安静地少一个包。宁可在上传前红一次。
        run: |
          set -eu
          ls -lah dist
          for want in luci-theme-footstrap luci-i18n-footstrap-zh-cn; do
            ls dist/"$want"[_-]* >/dev/null 2>&1 || {
              echo "没有编出 $want 包" >&2
              exit 1
            }
          done

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-footstrap-${{ matrix.sdk }}
          path: dist/*.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # 发布不靠外部打 tag：这里自己按 CHANGELOG 的最新版本号建 tag 并发布。
  # 产物就是 build 作业上传的那批，不重编一次：发布的东西必须和刚才验过的是
  # 同一份字节。
  release:
    name: 发布 Release
    needs: build
    # 只要 build 成功就发：push 到 main、手动触发、别人打的 tag 一视同仁。
    # 唯一例外是手动触发时把 publish 关掉（只想看 artifact）。
    # 之前这里写的是「只认 v* tag」，于是 push 到 main 跑完 action 什么也没发出去。
    if: always() && needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # 建 tag、建 release、传 asset 都要写权限；build 作业只有读权限。
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # 版本号取自 CHANGELOG 与 tag，要完整历史。
          fetch-depth: 0

      - name: 取回产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 定版本号与 tag
        id: ver
        run: |
          set -eu
          # 别人打的 v* tag 优先：那个 tag 就是这次要发的版本。
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            tag="$GITHUB_REF_NAME"
            ver="${tag#v}"
          else
            # 否则取 CHANGELOG 的最新一节。build 作业已经用它编过包，这里必须
            # 取到同一个值，否则 tag 与包内版本号对不上。
            ver=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
            [ -n "$ver" ] || { echo "CHANGELOG.md 里没有 '## [x.y.z]'" >&2; exit 1; }
            tag="v$ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "版本 $ver，tag $tag"

      - name: 检查 CHANGELOG 是否已切版本
        # 取到的版本号是「最新已发布版本」，而 [Unreleased] 里可能还压着没发的
        # 改动。这时打出来的包内容比 tag 新，发布说明却是旧版本的——第一次跑
        # 就撞上了：v0.14.21 的包里带着中文翻译与等宽修复，说明却是上游 0.14.21
        # 的。有 [Unreleased] 就说明这次是开发提交，只出 artifact 不发布；
        # 不判红，否则每次普通提交都会红一次。
        id: cut
        run: |
          set -eu
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md 里还有 [Unreleased]：本次是开发提交，只出 artifact。" >&2
            echo "要发布，把 [Unreleased] 改成 '## [<新版本>] — <日期>'（CHANGELOG_ru.md 同步）再推送。" >&2
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG 已切版本，最新一节是 ${{ steps.ver.outputs.version }}"
          fi

      - name: 写校验和
        if: steps.cut.outputs.released == 'true'
        # 包没有签名，装之前至少能核一下下载有没有坏。
        # 只编了一个 SDK 时另一种格式的 glob 不匹配，`sha256sum *.ipk *.apk` 会直接
        # 报错退出——先收集实际存在的文件，再交给 sha256sum。
        run: |
          set -eu
          ls -lah dist
          cd dist
          files=""
          for f in *.ipk *.apk; do
            [ -f "$f" ] && files="$files $f"
          done
          [ -n "$files" ] || { echo "dist 里没有包" >&2; exit 1; }
          # shellcheck disable=SC2086 # 空格分隔的文件名列表，这里就是要它分词
          sha256sum $files > SHA256SUMS
          cat SHA256SUMS

      - name: 生成发布说明
        if: steps.cut.outputs.released == 'true'
        # 优先用 CHANGELOG 里这一版的小节（tools/release-notes.sh）；没有对应小节时
        # 退回 GitHub 自动生成的提交列表，而不是让发布失败。
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          if sh tools/release-notes.sh "$VER" > release-notes.md 2>/dev/null; then
            # 脚本末尾那段 <details>Install</details> 是上游的 install.sh 一行命令。这个
            # fork 不发布 install.sh，也没有软件源，留着等于给一条装别人包的命令：整段删掉。
            sed -i '/<details><summary>Install<\/summary>/,$d' release-notes.md
            echo "发布说明取自 CHANGELOG.md 的 [$VER] 小节"
          else
            echo "CHANGELOG.md 里没有 [$VER] 小节，退回自动生成的提交列表" >&2
            rm -f release-notes.md
          fi

      - name: 建 Release 并挂上产物
        if: steps.cut.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          # 只编了一个 SDK 时另一种格式没有产物，glob 不匹配会让 gh 报错：先收集。
          files=""
          for f in dist/*.ipk dist/*.apk dist/SHA256SUMS; do
            [ -f "$f" ] && files="$files $f"
          done
          [ -n "$files" ] || { echo "没有可发布的产物" >&2; exit 1; }
          # 同一个版本号再次构建（push 到 main 但没升版本）时 release 已经存在：
          # 只补传产物，--clobber 覆盖同名 asset。不删 release——删了会连带删掉
          # 别人已经下载过的页面。
          # shellcheck disable=SC2086 # 空格分隔的文件名列表，这里就是要它分词
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新产物"
            gh release upload "$TAG" $files --clobber
          elif [ -f release-notes.md ]; then
            # tag 不存在时 gh 会自己建它，但默认指向「默认分支的最新状态」而不是本次
            # 构建的提交——显式 --target，发布的必须就是刚验过的那份源码。
            gh release create "$TAG" $files --target "$GITHUB_SHA" \
              --title "luci-theme-footstrap $VER" --notes-file release-notes.md
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" \
              --title "luci-theme-footstrap $VER" --generate-notes
          fi
